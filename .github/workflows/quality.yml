name: Cross-platform quality

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: madi-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop typecheck and focused tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact revision and Typie
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Activate pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          node --version
          pnpm --version

      - name: Install workspace without runtime postinstall
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check repository contracts
        run: |
          pnpm run check:toolchain
          pnpm run check:repository
          pnpm run format:check
          git diff --check

      - name: Typecheck desktop
        run: pnpm --filter @madi/desktop typecheck

      - name: Run focused transport and LLM tests
        run: |
          pnpm --filter @madi/desktop exec vitest run \
            tests/app-protocol.test.ts \
            tests/runtime-process-network-boundary.test.ts \
            tests/packaged-runtime-boundary.test.ts \
            tests/preload-api.test.ts \
            tests/llm-preload-bridge.test.ts \
            tests/ipc-sender-boundary.test.ts \
            tests/phase1e-main-ipc-contract.test.ts \
            tests/core-client-serialization.test.ts \
            tests/core-client-stop-barrier.test.ts \
            tests/atomic-output-shutdown.test.ts \
            tests/atomic-output-utf8.test.ts \
            tests/atomic-output-journal-utf8.test.ts \
            tests/phase1h-atomic-output-process.test.ts \
            tests/hwp-bridge-completion-race.test.ts \
            tests/phase1h-hwp-bridge-process.test.ts \
            tests/hwp-bridge-promise-contract.test.ts \
            tests/hwpx-crash-recovery-utf8.test.ts \
            tests/phase1g-epub-process.test.ts \
            tests/epub-export-utf8.test.ts \
            tests/phase1g-epub-desktop-service.test.ts \
            tests/phase1h-hwpx-process.test.ts \
            tests/hwpx-export-utf8.test.ts \
            tests/font-installation-refresh.test.ts \
            tests/project-session-registry.test.ts \
            tests/window-close.test.ts \
            tests/llm-contracts.test.ts \
            tests/llm-provider-store.test.ts \
            tests/llm-provider-store-utf8.test.ts \
            tests/llm-provider-store-path-integrity.test.ts \
            tests/llm-provider-store-revision.test.ts \
            tests/llm-provider-id-canonicalization.test.ts \
            tests/llm-runtime-service.test.ts \
            tests/llm-runtime-dispose.test.ts \
            tests/llm-client.test.ts \
            tests/llm-main-ipc.test.ts
