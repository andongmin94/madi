name: Apply Phase 1I-I
run-name: Apply Phase 1I-I — ${{ github.sha }}

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-phase1i-i.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: phase1i-i-main
  cancel-in-progress: false

jobs:
  apply:
    name: Promote AI safety snapshots and direct recovery
    runs-on: windows-latest
    timeout-minutes: 240

    steps:
      - name: Keep repository text files on LF
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Check out current main and Typie
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0

      - name: Verify bootstrap ancestry
        shell: pwsh
        run: |
          $parent = (git rev-parse HEAD^).Trim()
          if ($parent -ne "${{ github.event.before }}") {
            throw "Unexpected commit inserted between the Phase 1I-I bootstrap commits"
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Activate pinned pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          node --version
          pnpm --version

      - name: Set up pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --target wasm32-unknown-unknown --target x86_64-pc-windows-msvc
          rustup default 1.97.1
          rustc --version
          cargo --version

      - name: Apply Phase 1I-I
        shell: pwsh
        run: python .github/phase1i-i-apply.py

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Run focused verification
        shell: pwsh
        run: |
          pnpm --filter @madi/desktop typecheck
          pnpm --filter @madi/desktop exec vitest run `
            tests/llm-ai-snapshot-recovery-bridge.test.ts `
            tests/llm-ai-snapshot-recovery-panel.test.tsx `
            tests/llm-multi-block-review-overlay.test.tsx `
            tests/snapshot-panel.test.tsx
          pnpm --filter @madi/desktop build
          cargo fmt --manifest-path crates/madi-core/Cargo.toml -- --check
          cargo test --manifest-path crates/madi-core/Cargo.toml
          pnpm check:repository
          pnpm format:check
          git diff --check

      - name: Replace bootstrap commits with the product commit
        shell: pwsh
        run: |
          Remove-Item .github/phase1i-i-apply.py -Force
          Remove-Item .github/workflows/apply-phase1i-i.yml -Force

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --soft HEAD~2
          git add -A
          git commit -m "feat(llm): add first-class AI snapshot recovery"

          $finalSha = (git rev-parse HEAD).Trim()
          "FINAL_SHA=$finalSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "FINAL_SHA=$finalSha"
          git push origin HEAD:refs/heads/main --force-with-lease="refs/heads/main:${{ github.sha }}"

      - name: Remove accidental probe branches
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $branches = @(
            "__probe-do-not-use",
            "__this-should-not-be-created",
            "__accidental-probe-2",
            "__accidental-probe-3",
            "__accidental-probe-4",
            "__accidental-probe-5",
            "__cleanup-trigger-temp",
            "__cleanup-trigger-temp-2",
            "__cleanup-trigger-temp-3",
            "__cleanup-trigger-temp-4",
            "__cleanup-trigger-temp-5",
            "__cleanup-trigger-temp-6"
          )
          foreach ($branch in $branches) {
            gh api --method DELETE "repos/${{ github.repository }}/git/refs/heads/$branch" 2>$null
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Branch already absent or not deletable: $branch"
              $global:LASTEXITCODE = 0
            }
          }

      - name: Wait for authoritative Windows verification
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $verifyRun = $null
          for ($attempt = 0; $attempt -lt 90; $attempt += 1) {
            Start-Sleep -Seconds 5
            $runs = gh run list `
              --workflow windows-private-verify.yml `
              --branch main `
              --event push `
              --limit 30 `
              --json databaseId,headSha,status,conclusion,createdAt | ConvertFrom-Json
            $verifyRun = $runs |
              Where-Object { $_.headSha -eq $env:FINAL_SHA } |
              Sort-Object createdAt -Descending |
              Select-Object -First 1
            if ($verifyRun) { break }
          }
          if (-not $verifyRun) {
            throw "Could not locate Windows verification for $env:FINAL_SHA"
          }
          Write-Host "WINDOWS_VERIFY_RUN_ID=$($verifyRun.databaseId)"
          gh run watch $verifyRun.databaseId --exit-status --interval 30
