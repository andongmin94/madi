name: Reconcile Phase 1I-H-A
run-name: Reconcile Phase 1I-H-A — ${{ github.sha }}

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-phase1i-h-a.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: phase1i-h-a-reconcile-main
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile and verify snapshot-gated multi-block AI editing
    runs-on: windows-latest
    timeout-minutes: 240

    steps:
      - name: Keep repository text files on LF
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Check out current main and Typie
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0

      - name: Validate the temporary history
        shell: pwsh
        run: |
          $baseline = "b745f2eb20340167ae5b285b0aa9aef9fbb9b8f7"
          git merge-base --is-ancestor $baseline HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "Phase 1I-H-A baseline is not an ancestor of main"
          }
          $allowed = @(
            "chore: bootstrap verified Phase 1I-H-A apply",
            "feat(llm): enable snapshot-gated multi-block apply",
            "chore: reconcile verified Phase 1I-H-A state"
          )
          $subjects = @(git log --format=%s "$baseline..HEAD")
          foreach ($subject in $subjects) {
            if ($allowed -notcontains $subject) {
              throw "Refusing to rewrite unexpected main commit: $subject"
            }
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Activate pinned pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm --version
          node --version

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Set up pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --target wasm32-unknown-unknown --target x86_64-pc-windows-msvc
          rustup default 1.97.1
          rustc --version
          cargo --version

      - name: Apply Phase 1I-H-A when it is not yet present
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $bridge = "apps/desktop/src/renderer/llm/projectSafetySnapshotBridge.ts"
          $coordinatorTest = "apps/desktop/tests/llm-multi-block-apply-coordinator.test.ts"
          if ((Test-Path $bridge) -and (Test-Path $coordinatorTest)) {
            Write-Host "Phase 1I-H-A product files are already present"
          } else {
            $archive = Join-Path $env:RUNNER_TEMP "madi-phase1i-h-a-patch.zip"
            $blob = gh api "repos/$env:GITHUB_REPOSITORY/git/blobs/cf750f78eefe8b08541a3305319845239aa2e115" | ConvertFrom-Json
            if ($blob.encoding -ne "base64") {
              throw "Unexpected patch blob encoding"
            }
            $base64 = $blob.content -replace '\s', ''
            [System.IO.File]::WriteAllBytes(
              $archive,
              [System.Convert]::FromBase64String($base64)
            )
            $patchRoot = Join-Path $env:RUNNER_TEMP "madi-phase1i-h-a"
            New-Item -ItemType Directory -Force -Path $patchRoot | Out-Null
            Expand-Archive -Path $archive -DestinationPath $patchRoot -Force
            $script = Join-Path $patchRoot "madi-phase1i-h-a-patch/apply-phase1i-h-a.mjs"
            if (-not (Test-Path $script)) {
              throw "Phase 1I-H-A apply script is missing"
            }
            $head = (git rev-parse HEAD).Trim()
            $source = [System.IO.File]::ReadAllText($script)
            $source = $source.Replace(
              'const expectedHead = "b745f2eb20340167ae5b285b0aa9aef9fbb9b8f7";',
              "const expectedHead = `"$head`";"
            )
            [System.IO.File]::WriteAllText(
              $script,
              $source,
              [System.Text.UTF8Encoding]::new($false)
            )
            node $script
          }

          Remove-Item ".github/workflows/apply-phase1i-h-a.yml" -Force -ErrorAction SilentlyContinue
          Remove-Item ".github/workflows/reconcile-phase1i-h-a.yml" -Force

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Run focused desktop verification
        shell: pwsh
        run: |
          pnpm typecheck
          pnpm --filter @madi/desktop exec vitest run `
            tests/llm-multi-block-apply-coordinator.test.ts `
            tests/llm-project-safety-snapshot-bridge.test.ts `
            tests/llm-project-safety-snapshot-app-contract.test.ts `
            tests/llm-multi-block-review-overlay.test.tsx
          pnpm --filter @madi/desktop build
          pnpm check:repository
          pnpm format:check
          git diff --check

      - name: Replace temporary commits with one verified product commit
        shell: pwsh
        run: |
          $baseline = "b745f2eb20340167ae5b285b0aa9aef9fbb9b8f7"
          if (Test-Path ".github/workflows/apply-phase1i-h-a.yml") {
            throw "Temporary apply workflow was not removed"
          }
          if (Test-Path ".github/workflows/reconcile-phase1i-h-a.yml") {
            throw "Temporary reconcile workflow was not removed"
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          $treeSha = (git write-tree).Trim()
          $message = @"
          feat(llm): enable snapshot-gated multi-block apply

          phase1i-h-reconcile-run: $env:GITHUB_RUN_ID
          "@
          $finalSha = ($message.Trim() | git commit-tree $treeSha -p $baseline).Trim()
          if (-not $finalSha) {
            throw "Could not create the reconciled product commit"
          }
          git reset --hard $finalSha
          "FINAL_SHA=$finalSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "FINAL_SHA=$finalSha"

          $temporaryBranches = @(
            "__probe-do-not-use",
            "__this-should-not-be-created",
            "__accidental-probe-2",
            "__accidental-probe-3",
            "__accidental-probe-4",
            "__accidental-probe-5"
          )
          foreach ($branch in $temporaryBranches) {
            git push origin --delete $branch 2>$null
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Temporary branch already absent: $branch"
              $global:LASTEXITCODE = 0
            }
          }

          git push origin HEAD:refs/heads/main --force-with-lease="refs/heads/main:${{ github.sha }}"

      - name: Dispatch authoritative Windows verification
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run windows-private-verify.yml --ref main
          $verifyRun = $null
          for ($attempt = 0; $attempt -lt 90; $attempt += 1) {
            Start-Sleep -Seconds 5
            $runs = gh run list `
              --workflow windows-private-verify.yml `
              --branch main `
              --event workflow_dispatch `
              --limit 20 `
              --json databaseId,headSha,status,conclusion,createdAt | ConvertFrom-Json
            $verifyRun = $runs |
              Where-Object { $_.headSha -eq $env:FINAL_SHA } |
              Sort-Object createdAt -Descending |
              Select-Object -First 1
            if ($verifyRun) {
              break
            }
          }
          if (-not $verifyRun) {
            throw "Could not locate authoritative verification for $env:FINAL_SHA"
          }
          Write-Host "FINAL_VERIFY_RUN_ID=$($verifyRun.databaseId)"
          gh run watch $verifyRun.databaseId --exit-status --interval 30
