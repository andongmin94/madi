name: Reconcile Phase 1I-H-A
run-name: Reconcile Phase 1I-H-A — ${{ github.sha }}

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-phase1i-h-a.yml
      - .github/phase1i-h-a-patch.zip

permissions:
  contents: write

concurrency:
  group: phase1i-h-a-reconcile-main
  cancel-in-progress: false

jobs:
  reconcile:
    name: Apply and verify snapshot-gated multi-block AI editing
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Keep repository text files on LF
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Check out current main and Typie
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0

      - name: Verify temporary-only history
        shell: pwsh
        run: |
          $baseline = "b745f2eb20340167ae5b285b0aa9aef9fbb9b8f7"
          git merge-base --is-ancestor $baseline HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "Phase 1I-H-A baseline is not an ancestor of main"
          }

          $allowedPaths = @(
            ".github/workflows/apply-phase1i-h-a.yml",
            ".github/workflows/reconcile-phase1i-h-a.yml",
            ".github/phase1i-h-a-patch.zip"
          )
          $changedPaths = @(git diff --name-only "$baseline..HEAD")
          foreach ($changedPath in $changedPaths) {
            if ($allowedPaths -notcontains $changedPath) {
              throw "Refusing to rewrite unexpected main path: $changedPath"
            }
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Activate pinned pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm --version
          node --version

      - name: Apply exact Phase 1I-H-A patch
        shell: pwsh
        run: |
          $patchRoot = Join-Path $env:RUNNER_TEMP "madi-phase1i-h-a"
          New-Item -ItemType Directory -Force -Path $patchRoot | Out-Null
          Expand-Archive -Path ".github/phase1i-h-a-patch.zip" -DestinationPath $patchRoot -Force

          $script = Join-Path $patchRoot "madi-phase1i-h-a-patch/apply-phase1i-h-a.mjs"
          if (-not (Test-Path $script)) {
            throw "Phase 1I-H-A apply script is missing"
          }

          $head = (git rev-parse HEAD).Trim()
          $source = [System.IO.File]::ReadAllText($script)
          $source = $source.Replace(
            'const expectedHead = "b745f2eb20340167ae5b285b0aa9aef9fbb9b8f7";',
            "const expectedHead = `"$head`";"
          )
          [System.IO.File]::WriteAllText(
            $script,
            $source,
            [System.Text.UTF8Encoding]::new($false)
          )

          node $script

          Remove-Item ".github/workflows/reconcile-phase1i-h-a.yml" -Force
          Remove-Item ".github/phase1i-h-a-patch.zip" -Force

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Run focused verification
        shell: pwsh
        run: |
          pnpm typecheck
          pnpm --filter @madi/desktop exec vitest run `
            tests/llm-multi-block-apply-coordinator.test.ts `
            tests/llm-project-safety-snapshot-bridge.test.ts `
            tests/llm-project-safety-snapshot-app-contract.test.ts `
            tests/llm-multi-block-review-overlay.test.tsx
          pnpm --filter @madi/desktop build
          pnpm check:repository
          pnpm format:check
          git diff --check

      - name: Replace temporary commits with one product commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $baseline = "b745f2eb20340167ae5b285b0aa9aef9fbb9b8f7"
          if (Test-Path ".github/workflows/reconcile-phase1i-h-a.yml") {
            throw "Temporary reconcile workflow was not removed"
          }
          if (Test-Path ".github/phase1i-h-a-patch.zip") {
            throw "Temporary patch archive was not removed"
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          $treeSha = (git write-tree).Trim()
          $message = @"
          feat(llm): enable snapshot-gated multi-block apply

          phase1i-h-a-run: $env:GITHUB_RUN_ID
          "@
          $finalSha = ($message.Trim() | git commit-tree $treeSha -p $baseline).Trim()
          if (-not $finalSha) {
            throw "Could not create the Phase 1I-H-A product commit"
          }
          git reset --hard $finalSha

          $temporaryBranches = @(
            "__probe-do-not-use",
            "__this-should-not-be-created",
            "__accidental-probe-2",
            "__accidental-probe-3",
            "__accidental-probe-4",
            "__accidental-probe-5",
            "tmp-probe-do-not-create"
          )
          foreach ($branch in $temporaryBranches) {
            git push origin --delete $branch 2>$null
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Temporary branch already absent: $branch"
              $global:LASTEXITCODE = 0
            }
          }

          git push origin HEAD:refs/heads/main --force-with-lease="refs/heads/main:${{ github.sha }}"
          Write-Host "FINAL_SHA=$finalSha"
