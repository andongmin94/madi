name: Windows private verification
run-name: Windows private verification — ${{ github.ref_name }} @ ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  statuses: write

concurrency:
  group: windows-private-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify private-local Windows build
    runs-on: windows-latest
    timeout-minutes: 180

    env:
      CI: "true"
      PNPM_HOME: ${{ github.workspace }}\.pnpm-home
      MADI_VALIDATION_ROOT: ${{ github.workspace }}\.tools\phase1g-validation
      MADI_VERIFY_CONTEXT: madi/windows-private-verify

    steps:
      - name: Publish pending commit status
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST `
            "repos/${{ github.repository }}/statuses/${{ github.sha }}" `
            -f state=pending `
            -f context="$env:MADI_VERIFY_CONTEXT" `
            -f description="Windows verification is running" `
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Check out exact madi revision and Typie
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Activate pinned pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm --version
          node --version

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Install x86 .NET 10 runtime
        shell: pwsh
        run: |
          $installScript = Join-Path $env:RUNNER_TEMP "dotnet-install.ps1"
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile $installScript
          & $installScript -Channel 10.0 -Runtime dotnet -Architecture x86 -InstallDir "$env:LOCALAPPDATA\Microsoft\dotnet\x86"
          "$env:LOCALAPPDATA\Microsoft\dotnet\x86" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --target wasm32-unknown-unknown --target x86_64-pc-windows-msvc
          rustup default 1.97.1
          rustc --version
          cargo --version

      - name: Provision pinned offline EPUB validation tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:MADI_VALIDATION_ROOT | Out-Null

          $epubcheck = Join-Path $env:MADI_VALIDATION_ROOT "epubcheck-5.3.0.zip"
          $temurin = Join-Path $env:MADI_VALIDATION_ROOT "temurin-jre-21.0.11+10.zip"

          Invoke-WebRequest "https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip" -OutFile $epubcheck
          Invoke-WebRequest "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.11%2B10/OpenJDK21U-jre_x64_windows_hotspot_21.0.11_10.zip" -OutFile $temurin

          $epubcheckHash = (Get-FileHash -Algorithm SHA256 $epubcheck).Hash.ToLowerInvariant()
          $temurinHash = (Get-FileHash -Algorithm SHA256 $temurin).Hash.ToLowerInvariant()

          if ($epubcheckHash -ne "6c07e68584b2e2ce2f89fe06e1246dfead3eb36b46b340e7d93524f29dcff6c5") {
            throw "Unexpected EPUBCheck archive hash: $epubcheckHash"
          }
          if ($temurinHash -ne "be26677aaa20b39a62edcaab4c8857a8b76673b0f45abc0b6143b142b62717e4") {
            throw "Unexpected Temurin archive hash: $temurinHash"
          }

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Run full repository verification
        shell: pwsh
        run: pnpm verify

      - name: Enforce repository hygiene
        shell: pwsh
        run: |
          pnpm check:repository
          pnpm format:check
          git diff --check

          $dirty = @(git status --porcelain=v1 --untracked-files=all)
          if ($dirty.Count -ne 0) {
            $dirty | ForEach-Object { Write-Host $_ }
            throw "Verification left the repository dirty"
          }

          $badSubmodules = @(git submodule status --recursive | Where-Object { $_ -match '^[+\-U]' })
          if ($badSubmodules.Count -ne 0) {
            $badSubmodules | ForEach-Object { Write-Host $_ }
            throw "A submodule is missing, modified, or on the wrong revision"
          }

          $workflowNames = @(Get-ChildItem ".github/workflows" -File | Sort-Object Name | ForEach-Object Name)
          if ($workflowNames.Count -ne 1 -or $workflowNames[0] -ne "windows-private-verify.yml") {
            throw "Only windows-private-verify.yml may remain in .github/workflows"
          }

          $forbidden = @(
            Get-ChildItem ".github" -Recurse -File |
              Where-Object {
                $_.FullName -notmatch 'windows-private-verify\.yml$' -and
                ($_.Name -match '^(apply|reconcile|bootstrap)-' -or
                 $_.Name -match 'phase1i.*\.(py|mjs|b64|zip)$' -or
                 $_.FullName -match 'phase1i-[^\\/]+-patch')
              }
          )
          if ($forbidden.Count -ne 0) {
            $forbidden | ForEach-Object { Write-Host $_.FullName }
            throw "Temporary apply or patch artifacts remain under .github"
          }

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: madi-windows-private-verification-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            output/playwright/**
            output/test-fixtures/**
            docs/PHASE_1H_RESULT.md
            docs/HWPX_EXPORT_PERFORMANCE.md
            docs/HANCOM_AUTOMATION_VALIDATION.md

      - name: Publish final commit status
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $state = if ("${{ job.status }}" -eq "success") { "success" } elseif ("${{ job.status }}" -eq "cancelled") { "error" } else { "failure" }
          $description = if ($state -eq "success") { "Windows verification passed" } elseif ($state -eq "error") { "Windows verification was cancelled" } else { "Windows verification failed" }
          gh api --method POST `
            "repos/${{ github.repository }}/statuses/${{ github.sha }}" `
            -f state="$state" `
            -f context="$env:MADI_VERIFY_CONTEXT" `
            -f description="$description" `
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
