[package]
name = "madi-export-hwpx"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Deterministic, Publication IR-only HWPX compiler and internal validator for madi"
license = "UNLICENSED"
publish = false

[lib]
name = "madi_export_hwpx"
path = "src/lib.rs"

[[bin]]
name = "madi-export-hwpx"
path = "src/main.rs"

[dependencies]
madi-publication = { path = "../madi-publication" }
quick-xml = "0.37"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.12"
thiserror = "2.0"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[dev-dependencies]
serde_json = "1.0"

[patch.crates-io]
bytecount = { git = "https://github.com/devunt/bytecount.git", rev = "26230b690d7080da253768586db96d4f8e17b6ec" }
