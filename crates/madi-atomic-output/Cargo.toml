[package]
name = "madi-atomic-output"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Compensation- and recovery-aware Windows output replacement helper for madi"
license = "UNLICENSED"
publish = false

[lib]
name = "madi_atomic_output"
path = "src/lib.rs"

[[bin]]
name = "madi-atomic-output"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
tempfile = "3.12"
