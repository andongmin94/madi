[package]
name = "madi-publication"
version = "0.1.0"
edition = "2024"
description = "Engine-isolated Typie snapshot decoder and Publication IR compiler for madi"
license = "UNLICENSED"
publish = false

[dependencies]
editor-codec = { path = "../../vendor/typie/crates/editor-codec" }
editor-crdt = { path = "../../vendor/typie/crates/editor-crdt" }
editor-model = { path = "../../vendor/typie/crates/editor-model" }
editor-state = { path = "../../vendor/typie/crates/editor-state" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[dev-dependencies]
editor-codec = { path = "../../vendor/typie/crates/editor-codec", features = ["test-util"] }

[patch.crates-io]
bytecount = { git = "https://github.com/devunt/bytecount.git", rev = "26230b690d7080da253768586db96d4f8e17b6ec" }
