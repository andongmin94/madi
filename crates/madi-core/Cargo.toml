[package]
name = "madi-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Local SQLite project core and JSON-lines sidecar for madi"
license = "UNLICENSED"
publish = false

[lib]
name = "madi_core"
path = "src/lib.rs"

[[bin]]
name = "madi-core"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
madi-publication = { path = "../madi-publication" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "1.0"
uuid = { version = "1.10", features = ["v4"] }

[dev-dependencies]
editor-codec = { path = "../../vendor/typie/crates/editor-codec", features = ["test-util"] }
editor-model = { path = "../../vendor/typie/crates/editor-model" }
editor-state = { path = "../../vendor/typie/crates/editor-state" }
tempfile = "3.12"

[patch.crates-io]
bytecount = { git = "https://github.com/devunt/bytecount.git", rev = "26230b690d7080da253768586db96d4f8e17b6ec" }
