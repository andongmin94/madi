[package]
name = "madi-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Local SQLite project core and JSON-lines sidecar for madi"
license = "UNLICENSED"
publish = false

[lib]
name = "madi_core"
path = "src/lib.rs"

[[bin]]
name = "madi-core"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.10", features = ["v4"] }

[dev-dependencies]
sha2 = "0.10"
tempfile = "3.12"
